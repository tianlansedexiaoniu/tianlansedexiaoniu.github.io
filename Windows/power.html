<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>电源菜单</title>
<link rel="icon" href="../img/hyx.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/close.css">
<script src="../css/hyxtoolbox.js"></script>
</head>
<body>
<table align="right">
<tr>
<td><a href="../hyxtoolbox.html"><button class="x">✕</button></a></td>
</tr>
</table>
<table>
<tr>
<td><p>睡眠</p></td>
<td><button onclick="hyxtoolbox.run('rundll32 powrprof.dll,SetSuspendState 0,1,0')"class="ico"style="background:url(../icon/22.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>关机</p></td>
<td><button onclick="hyxtoolbox.run('shutdown /f /s /t 0')"class="ico"style="background:url(../icon/4.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>定时关机</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;set /p t=Shutdown in seconds: &amp; shutdown /s /t %t%&quot;')"class="ico"style="background:url(../icon/4.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>重启</p></td>
<td><button onclick="hyxtoolbox.run('shutdown /f /r /t 0')"class="ico"style="background:url(../icon/23.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>定时重启</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;set /p t=Reboot in seconds: &amp; shutdown /r /t %t%&quot;')"class="ico"style="background:url(../icon/23.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>注销</p></td>
<td><button onclick="hyxtoolbox.run('shutdown /f /l')"class="ico"style="background:url(../icon/24.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>进入BIOS设置</p></td>
<td><button onclick="hyxtoolbox.run('shutdown /r /fw /t 0')" style="border:none;height:32px;width:37px;background:url(../icon/65.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><button>高级启动选项</button></td>
</tr>
</table>
</body>
</html>
