<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>系统操作</title>
<link rel="icon" href="../img/hyx.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/close.css">
<script src="../css/hyxtoolbox.js"></script>
</head>
<body>
<table align="right">
<tr>
<td><a href="../hyxtoolbox.html"><button class="x">✕</button></a></td>
</tr>
</table>
<div style="border:none;text-align:center"><font size=8>系统操作</font></div>
<table>
<tr>
<td><p>重启explorer.exe</p></td>
<td><button onclick="hyxtoolbox.run('cmd /c &quot;taskkill /f /im explorer.exe &amp;&amp; start explorer.exe&quot;')">重启</button></td>
</tr>
</table>
<table>
<tr>
<td><p>关闭vbs/js脚本(强制停止VBScript/JavaScript病毒运行)</p></td>
<td><button onclick="hyxtoolbox.run('taskkill /f /t /im wscript.exe')">关闭</button></td>
</tr>
</table>
<table>
<tr>
<td><p>关闭bat脚本(强制停止Batch病毒运行)</p></td>
<td><button onclick="hyxtoolbox.run('taskkill /f /t /im cmd.exe')">关闭</button></td>
</tr>
</table>
<table>
<tr>
<td><p>修复BIOS启动文件</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;bootrec /fixmbr &amp; bootrec /fixboot &amp; bootrec /scanos &amp; bootrec /rebuildbcd&quot;')">修复</button></td>
</tr>
</table>
<table>
<tr>
<td><p>修复UEFI启动文件</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;bcdboot C:\\Windows /l zh-cn&quot;')">修复</button></td>
</tr>
</table>
<table>
<tr>
<td><p>扫描垃圾</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;dir /s /b C:\\*.tmp C:\\*.log C:\\*.old C:\\*.bak 2>nul&quot;')">扫描</button></td>
</tr>
</table>
<table>
<tr>
<td><p>清理垃圾</p></td>
<td><button onclick="hyxtoolbox.run('cmd /c &quot;del /f /s /q C:\\*.tmp C:\\*.log C:\\*.old C:\\*.bak&quot;')">清理</button></td>
</tr>
</table>
<table>
<tr>
<td><p>修改系统属性</p></td>
<td><button onclick="hyxtoolbox.run('sysdm.cpl')">修改</button></td>
</tr>
</table>
</body>
</html>
