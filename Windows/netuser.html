<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>高级账号设置</title>
<link rel="icon" href="../img/hyx.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/close.css">
<script src="../css/hyxtoolbox.js"></script>
</head>
<body>
<table align="right">
<tr>
<td><a href="../hyxtoolbox.html"><button class="x">×</button></a></td>
</tr>
</table>
<div style="border:none;text-align:center"><font size=8 color=#46A3FF>高级账号设置</font></div>
<table align="right">
<tr>
<td><p>修改密码(需要管理员权限)</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;set /p p=New password: &amp; net user %username% %p%&quot;')"class="ico"style="background:url(../icon/61.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>新建账户(需要管理员权限)</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;set /p u=User name: &amp; set /p p=Password: &amp; net user %u% %p% /add&quot;')"class="ico"style="background:url(../icon/62.png)"></button></td>
</tr>
</table>
<table align="right">
<tr>
<td><p>删除账户(需要管理员权限)</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k &quot;set /p u=User name to delete: &amp; net user %u% /del&quot;')"class="ico"style="background:url(../icon/63.png)"></button></td>
</tr>
</table>
<table>
<tr>
<td><p>清空密码(需要管理员权限)</p></td>
<td><button onclick="hyxtoolbox.run('cmd /k net user %username% &quot;&quot;')"class="ico"style="background:url(../icon/64.png)"></button></td>
</tr>
</table>
<table align="right">
<tr>
<td><p>注销账户</p></td>
<td><button onclick="hyxtoolbox.run('shutdown /f /l')"class="ico"style="background:url(../icon/24.png)"></button></td>
</tr>
</table>
</body>
</html>
